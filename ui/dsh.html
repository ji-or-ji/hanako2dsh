<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  * { box-sizing: border-box; }
  #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .center {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; padding: 24px; text-align: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text-muted, #6b7280); font-size: 14px; letter-spacing: .02em;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .6; animation: pulse 1.2s ease-in-out infinite; }
  .row { display: flex; align-items: center; gap: 8px; }
  .small { font-size: 12px; opacity: .7; max-width: 640px; line-height: 1.6; }
  .waves span { display: inline-block; animation: bounce 1.2s infinite; }
  .waves span:nth-child(2) { animation-delay: .15s; }
  .waves span:nth-child(3) { animation-delay: .3s; }
  @keyframes pulse { 0%, 100% { opacity: .3 } 50% { opacity: 1 } }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0) } 40% { transform: translateY(-4px) } }

  /* 返回 Hana 的小控件：平时很淡，鼠标靠近才亮，尽量不挡 DSH 自己的按钮 */
  #back {
    position: fixed; left: 10px; bottom: 10px; z-index: 20;
    width: 30px; height: 30px; padding: 0; border: 0; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(18, 22, 27, .55);
    color: #cfd8e3;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .28);
    backdrop-filter: blur(8px);
    opacity: .34; cursor: pointer;
    transition: opacity .18s ease, transform .18s ease, background .18s ease;
    -webkit-app-region: no-drag;
  }
  #back:hover, #back:focus-visible { opacity: 1; background: rgba(18, 22, 27, .82); transform: translateY(-1px); }
  #back:disabled { cursor: default; opacity: .25; }
  #back[hidden] { display: none; }
  #back svg { width: 16px; height: 16px; display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<button id="back" hidden aria-label="返回 Hana" title="返回 Hana（回到进入前的对话）">
  <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
    <path d="M9.75 3.5L5.25 8l4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="11.75" cy="8" r="1.15" fill="currentColor"/>
  </svg>
</button>
<script type="module">
  import { hana } from "./assets/sdk.js";

  // 代理端口写死，跟 runtime/server.mjs 保持一致。
  // 端口一旦变，这个页面里的 iframe 就指不到东西了。
  const PORT = 41888;
  const BASE = `http://127.0.0.1:${PORT}`;

  const stage = document.getElementById("stage");
  const back = document.getElementById("back");
  let iframe = null;
  let lastKey = "";

  function renderStatus(title, detail, hint) {
    if (lastKey === `status:${title}:${detail}`) return;
    lastKey = `status:${title}:${detail}`;
    iframe = null;
    stage.innerHTML = `
      <div class="center">
        <div class="row"><span class="dot"></span><span>${title}</span></div>
        ${detail ? `<div class="small">${detail}</div>` : ""}
        ${hint ? `<div class="small">${hint}</div>` : ""}
      </div>`;
  }

  function renderFrame() {
    if (lastKey === "frame") return;
    lastKey = "frame";
    stage.innerHTML = `<iframe id="frame" src="${BASE}/" allow="clipboard-read; clipboard-write"></iframe>`;
    iframe = document.getElementById("frame");
  }

  function esc(value) {
    return String(value ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  // ── 返回 Hana ──────────────────────────────────────────────────────
  // 进这一页时记下当时正在看哪个对话，点返回就 focus 回它：
  // 宿主会把前台导航切回那个对话（也就是主页里的聊天页）。
  let homeSessionId = null;
  let captured = false;

  async function rememberHome() {
    if (captured) return;
    try {
      const active = await hana.sessions.getActive();
      homeSessionId = active?.sessionId || null;
      captured = Boolean(homeSessionId);
    } catch {
      homeSessionId = null;
    }
    back.hidden = !homeSessionId;
    back.title = homeSessionId ? "返回 Hana（回到进入前的对话）" : "没有可返回的对话";
  }

  back.addEventListener("click", async () => {
    if (!homeSessionId) return;
    back.disabled = true;
    try {
      await hana.sessions.focus({ sessionId: homeSessionId });
    } catch (err) {
      back.disabled = false;
      back.title = `返回失败：${err?.message || err}`;
    }
  });

  async function tick() {
    try {
      const res = await fetch(`${BASE}/__hb?_=${Date.now()}`, { cache: "no-store" });
      const state = await res.json();
      if (state.chatting) {
        renderStatus(
          `${esc(state.chatAgent || "Hanako")} 正在和大肥鱼交流<span class="waves"><span>.</span><span>.</span><span>.</span></span>`,
          state.progress ? esc(state.progress) : "",
        );
      } else if (!state.ready) {
        renderStatus(
          "正在拉起 DSH 实例并登录…",
          `状态：${esc(state.status)}${state.lastError ? ` · ${esc(state.lastError)}` : ""}`,
          "第一次启动会慢一些；实在起不来就跑一次 diagnose 工具。",
        );
      } else {
        renderFrame();
      }
    } catch {
      renderStatus(
        "本地代理还没起来",
        `在等 127.0.0.1:${PORT} 上的 DSH 代理。`,
        "如果一直这样，多半是端口被占用了，或者 DSH 安装目录没配对。",
      );
    }
    setTimeout(tick, 1500);
  }

  await hana.ready?.();
  void rememberHome();
  // 页面被切走再切回来时，重新记一次“进入前的对话”。
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") void rememberHome();
  });
  tick();
</script>
</body>
</html>
